{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Transaction</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" type="image/png" href="{% static 'images/logo2.png' %}">
</head>
<body class="add-page">
    <button class="back-btn" onclick="history.back()">&#8592; Back</button>
    <div class="form-container add-container">
        <div class="form-header">
            <div class="form-icon">&#x2795;</div>
            <div class="form-text">
                <h2>Add Transaction</h2>
                <p>Add a new income or expense</p>
            </div>
        </div>

        <form method="POST">
            {% csrf_token %}

            <!-- ROW 1 -->
            <div class="form-row">
                <div class="form-group">
                    <label>Type</label>
                    <select name="transaction_type">
                        {% for value,label in type_choices %}
                            <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select> 
                </div>

                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" name="amount" placeholder="Amount" required> 
                </div>
            </div>

            <!-- ROW 2 -->
            <div class="form-row">
                <div class="form-group">
                    <label>Category</label>
                    <select name="category">
                        {% for value,label in category_choices %}
                            <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div> 

                <div class="form-group">
                    <label>Payment Method</label>
                    <select name="payment_method">
                        {% for value,label in payment_choices %}
                            <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select> 
                </div>
            </div>

            <!-- DATE -->
            <div class="form-group">
                <label>Date</label>
            <input type="date" name="date" required> 
            </div>

            <!-- DESCRIPTION -->
             <div class="form-group">
                <label>Description (Optional)</label>
                <textarea name="description" placeholder="Enter description"></textarea>
            </div>

            <!-- BUTTON -->
            <button type="submit" class="add-btn">Add Transaction</button>
        </form>
    </div>
</body>
</html>
